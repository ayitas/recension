name: recension

services:
  postgres:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_USER: recension
      POSTGRES_PASSWORD: recension
      POSTGRES_DB: recension
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recension -d recension"]
      interval: 3s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: recension
      MINIO_ROOT_PASSWORD: recensionsecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  api:
    build:
      context: ..
      dockerfile: ops/Dockerfile.api
    environment:
      RECENSION_ENV: development
      RECENSION_PORT: "8080"
      RECENSION_API_KEY: ${RECENSION_API_KEY:-dev-api-key}
      RECENSION_BOOTSTRAP_PASSWORD: ${RECENSION_BOOTSTRAP_PASSWORD:-dev-password}
      RECENSION_SESSION_SECRET: ${RECENSION_SESSION_SECRET:-recension-dev-secret-change-me}
      RECENSION_BOOTSTRAP: ${RECENSION_BOOTSTRAP:-true}
      RECENSION_ALLOW_SIGNUP: ${RECENSION_ALLOW_SIGNUP:-true}
      RECENSION_DATABASE_URL: postgres://recension:recension@postgres:5432/recension?sslmode=disable
      RECENSION_S3_ENDPOINT: minio:9000
      RECENSION_S3_ACCESS_KEY: recension
      RECENSION_S3_SECRET_KEY: recensionsecret
      RECENSION_S3_BUCKET: recension
      RECENSION_S3_USE_SSL: "false"
      RECENSION_CORS_ORIGINS: "*"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  web:
    build:
      context: ../web
      dockerfile: ../ops/Dockerfile.web
    environment:
      PORT: "3000"
      HOST: 0.0.0.0
    depends_on:
      - api

  gateway:
    image: nginx:1.30-alpine
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web

volumes:
  pgdata:
  miniodata:
